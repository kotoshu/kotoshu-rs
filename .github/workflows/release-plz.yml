# Release-plz.
#
# DISABLED UNTIL THE FIRST CRATE RELEASE. Crate versions, MSRV, and the
# first release are owner decisions (plan 67 owner-decision gates). The job
# is gated on the repository variable RELEASE_PLZ_ENABLED == "true" and has
# no push trigger; to enable, the owner sets that variable and
# CARGO_REGISTRY_TOKEN, then adds the `push: branches: [main]` trigger.
# Versioning policy: separate version lines per package; release-plz
# automates the core's only (plan 66).

name: Release

permissions:
  contents: write
  pull-requests: write

on:
  workflow_dispatch:

jobs:
  release-plz:
    name: Release-plz (gated on RELEASE_PLZ_ENABLED)
    runs-on: ubuntu-latest
    if: vars.RELEASE_PLZ_ENABLED == 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Run release-plz
        uses: MarcoIeni/release-plz-action@v0.5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
