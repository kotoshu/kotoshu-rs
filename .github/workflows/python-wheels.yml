# Python wheel matrix for the `kotoshu-native` wheel (plan 93).
#
# One job per platform builds the maturin wheel for CPython 3.10-3.13:
#   linux x86_64 + aarch64 — one job per arch inside the manylinux container
#                            (all four interpreters in a single build;
#                            aarch64 runs on GitHub's native arm64 runner,
#                            no cross toolchain)
#   linux emulated         — i686 / armv7 / ppc64le / s390x / riscv64 via
#                            QEMU on the x86_64 runner (the leptris-py#346
#                            pattern): a single cp310 wheel per arch, each
#                            smoke-tested inside the emulated container
#   macOS x86_64 + arm64   — host builds, one wheel per interpreter
#   windows x64            — host builds, one wheel per interpreter
# Every wheel is smoke-tested (pip install + scripts/python_wheel_smoke.py:
# import, VERSION, real Dictionary.load/correct/suggest over a minimal
# dictionary) before its artifact is uploaded. The deep conformance smoke
# over the gem fixtures stays in python-ffi.yml (bash-only fixture sync).
#
# Reusable: release-pypi.yml calls this workflow for the tag-triggered
# publish, so the release matrix is exactly this CI matrix (single source
# of truth). Paths gating keeps the 16-job matrix off unrelated PRs;
# workflow_dispatch runs it in full.
#
# NOTE: maturin runs with working-directory: kotoshu-python, so --out
# ../dist puts every artifact at the repo-root dist/ where the report,
# smoke and upload steps (and the release publish job) expect them.

name: Python wheels

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "kotoshu-python/**"
      - "kotoshu/Cargo.toml"
      - "kotoshu/src/ffi/python/**"
      - "Cargo.lock"
      - "scripts/python_wheel_smoke.py"
      - ".github/workflows/python-wheels.yml"
  pull_request:
    paths:
      - "kotoshu-python/**"
      - "kotoshu/Cargo.toml"
      - "kotoshu/src/ffi/python/**"
      - "Cargo.lock"
      - "scripts/python_wheel_smoke.py"
      - ".github/workflows/python-wheels.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  wheels-linux:
    name: wheels (manylinux ${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            os: ubuntu-latest
          - arch: aarch64
            os: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Build cp310-cp313 wheels in the manylinux container
        uses: PyO3/maturin-action@v1
        with:
          args: --release --out ../dist -i 3.10 3.11 3.12 3.13
          manylinux: auto
          sccache: "true"
          working-directory: kotoshu-python
      - name: Report wheels
        run: ls -lh dist
      - uses: astral-sh/setup-uv@v5
      - name: Smoke every wheel (pip install + import + engine call)
        run: |
          set -euo pipefail
          for py in 3.10 3.11 3.12 3.13; do
            venv="$RUNNER_TEMP/venv-$py"
            echo "=== smoke: python $py ==="
            uv venv --python "$py" "$venv"
            uv pip install --python "$venv/bin/python" --no-index --find-links dist kotoshu-native
            "$venv/bin/python" scripts/python_wheel_smoke.py
          done
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-manylinux-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error

  wheels-linux-emulated:
    name: wheels (manylinux emulated ${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: i686
          - arch: armv7l
          - arch: ppc64le
          - arch: s390x
          - arch: riscv64
    steps:
      - uses: actions/checkout@v4
      # docker's embedded loopback DNS (127.0.0.11) is unreachable for
      # binaries under qemu-i386 — the i686 leg lost every pypi/rustup
      # connection to "Name or service not known". Point the daemon at
      # real resolvers so every container it creates (cibuildwheel's
      # included) resolves normally.
      - name: Give docker real DNS servers
        run: |
          sudo tee /etc/docker/daemon.json > /dev/null <<'EOF'
          { "dns": ["8.8.8.8", "1.1.1.1"] }
          EOF
          sudo systemctl restart docker
      # Cross-arch Linux legs build AND smoke inside cibuildwheel's
      # managed manylinux container under QEMU (the leptris-py#346
      # pattern): container selection, emulation, and the test venv
      # are all cibuildwheel's job — hand-rolled docker legs died on
      # DNS and image-manifest mismatches. A single cp310 wheel per
      # arch — the full 3.10-3.13 range stays on the native legs
      # (emulation multiplies run time four-fold for little value).
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: all
      - name: Build and smoke the cp310 wheel under emulation
        uses: pypa/cibuildwheel@v3.4.1
        with:
          package-dir: kotoshu-python
        env:
          CIBW_BUILD: "cp310-manylinux_${{ matrix.arch }}"
          CIBW_ARCHS_LINUX: "${{ matrix.arch }}"
          CIBW_TEST_COMMAND: "python {project}/../scripts/python_wheel_smoke.py"
          # the riscv64/armv7 manylinux images ship no Rust toolchain —
          # maturin's bootstrap died mapping riscv64-unknown-linux-gnu;
          # a real rustup in PATH bypasses it
          CIBW_BEFORE_ALL_LINUX: "curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable"
          CIBW_ENVIRONMENT: 'PATH="$HOME/.cargo/bin:$PATH"'
      - name: Report wheel
        run: ls -lh wheelhouse
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-manylinux-emulated-${{ matrix.arch }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  wheels-host:
    name: wheels (${{ matrix.artifact }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            python: "3.10"
            artifact: macos-x86_64-py310
          - os: macos-15-intel
            python: "3.11"
            artifact: macos-x86_64-py311
          - os: macos-15-intel
            python: "3.12"
            artifact: macos-x86_64-py312
          - os: macos-15-intel
            python: "3.13"
            artifact: macos-x86_64-py313
          - os: macos-15
            python: "3.10"
            artifact: macos-arm64-py310
          - os: macos-15
            python: "3.11"
            artifact: macos-arm64-py311
          - os: macos-15
            python: "3.12"
            artifact: macos-arm64-py312
          - os: macos-15
            python: "3.13"
            artifact: macos-arm64-py313
          - os: windows-latest
            python: "3.10"
            artifact: windows-x64-py310
          - os: windows-latest
            python: "3.11"
            artifact: windows-x64-py311
          - os: windows-latest
            python: "3.12"
            artifact: windows-x64-py312
          - os: windows-latest
            python: "3.13"
            artifact: windows-x64-py313
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Build the wheel for CPython ${{ matrix.python }}
        uses: PyO3/maturin-action@v1
        with:
          args: --release --out ../dist
          sccache: "true"
          working-directory: kotoshu-python
      - name: Report wheel
        run: ls -lh dist
        shell: bash
      - name: Smoke the wheel (pip install + import + engine call)
        run: |
          python -m pip install --no-index --find-links dist kotoshu-native
          python scripts/python_wheel_smoke.py
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.artifact }}
          path: dist/
          if-no-files-found: error

  sdist:
    name: sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build the sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out ../dist
          working-directory: kotoshu-python
      - name: Report sdist
        run: ls -lh dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: dist/
          if-no-files-found: error
