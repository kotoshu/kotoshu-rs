# CI: fmt + clippy + test on stable, Linux and macOS.
# Ruby and wasm features get their own workflows (ruby-ffi.yml, wasm.yml).

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: short
  RUSTFLAGS: "-D warnings"

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo clippy --all-targets --no-default-features -- -D warnings
      - run: cargo clippy --all-targets --features onnx,resources -- -D warnings
      - run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: "-D warnings"

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Sync gem conformance vectors and fixtures
        # The conformance test asserts the full 2630-vector pack when the
        # fixture dictionaries are present; without this step it skips
        # gracefully. Fixture files are never committed to this repo.
        run: |
          git clone --depth 1 https://github.com/kotoshu/kotoshu "$RUNNER_TEMP/kotoshu"
          KOTOSHU_GEM_DIR="$RUNNER_TEMP/kotoshu" scripts/sync_conformance.sh
      - name: Build
        run: cargo build --verbose
      - name: Test
        run: cargo test --verbose
      - name: Build ruby feature (dep-free until P4)
        run: cargo build --features ruby --verbose

  # P3: the ort provider against the REAL en/mini model. pip's
  # onnxruntime supplies libonnxruntime (ort is load-dynamic only —
  # nothing onnxruntime-shaped is ever bundled); the ignored
  # integration test downloads the ~3 MB artifact through the resource
  # layer and sha-verifies it against the registry fixture.
  onnx:
    name: ONNX rerank (integration)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install onnxruntime and locate its libonnxruntime
        run: |
          pip install onnxruntime
          dylib="$(python3 -c "import glob, os, onnxruntime; root = os.path.dirname(onnxruntime.__file__); print(glob.glob(os.path.join(root, 'capi', 'libonnxruntime*.so*'))[0])")"
          test -n "$dylib"
          echo "KOTOSHU_ORT_DYLIB=$dylib" >> "$GITHUB_ENV"
      - name: Unit tests with features
        run: cargo test --verbose --features onnx,resources
      - name: Integration test (ignored; network + dylib)
        run: cargo test --features onnx,resources --test rerank_integration -- --ignored --nocapture
