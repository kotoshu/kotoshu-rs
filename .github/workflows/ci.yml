# CI: fmt + clippy + test on stable, Linux and macOS.
# Ruby and wasm features get their own workflows (ruby-ffi.yml, wasm.yml).

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: short
  RUSTFLAGS: "-D warnings"

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo clippy --all-targets --no-default-features -- -D warnings
      - run: cargo clippy --all-targets --features onnx,resources -- -D warnings
      - run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: "-D warnings"

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Sync gem conformance vectors and fixtures
        # The conformance test asserts the full 2630-vector pack when the
        # fixture dictionaries are present; without this step it skips
        # gracefully. Fixture files are never committed to this repo.
        run: |
          git clone --depth 1 https://github.com/kotoshu/kotoshu "$RUNNER_TEMP/kotoshu"
          KOTOSHU_GEM_DIR="$RUNNER_TEMP/kotoshu" scripts/sync_conformance.sh
      - name: Build
        run: cargo build --verbose
      - name: Test
        run: cargo test --verbose
      # The int8 tier reader (rerank::int8_model) + its checked-in
      # real-derived fixture (plan 85) — feature `model`, no runtime deps.
      - name: Test model feature
        run: cargo test --verbose --features model
      # The ruby feature's build/test/smoke lives in ruby-ffi.yml (needs a
      # Ruby toolchain since P4 attached magnus); wasm in wasm.yml.

  # P3: the ort provider against the REAL en/mini model. pip's
  # onnxruntime supplies libonnxruntime (ort is load-dynamic only —
  # nothing onnxruntime-shaped is ever bundled); the ignored
  # integration test downloads the ~3 MB artifact through the resource
  # layer and sha-verifies it against the registry fixture.
  onnx:
    name: ONNX rerank (integration)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install onnxruntime and locate its libonnxruntime
        run: |
          pip install onnxruntime
          # The capi/ directory also ships libonnxruntime_providers_shared.so
          # (no OrtGetApiBase); select the main library, providers excluded,
          # preferring the unversioned name.
          dylib="$(python3 -c "import glob, os, onnxruntime; root = os.path.join(os.path.dirname(onnxruntime.__file__), 'capi'); cands = [p for p in glob.glob(os.path.join(root, 'libonnxruntime*.so*')) if 'providers' not in os.path.basename(p)]; cands.sort(key=lambda p: (not os.path.basename(p).startswith('libonnxruntime.so'), len(p))); print(cands[0])")"
          test -n "$dylib"
          echo "KOTOSHU_ORT_DYLIB=$dylib" >> "$GITHUB_ENV"
      - name: Sync gem conformance vectors and fixtures
        # The integration test reranks suggest("helo") through the base
        # fixture dictionary; without the sync it skips that section.
        run: |
          git clone --depth 1 https://github.com/kotoshu/kotoshu "$RUNNER_TEMP/kotoshu"
          KOTOSHU_GEM_DIR="$RUNNER_TEMP/kotoshu" scripts/sync_conformance.sh
      - name: Unit tests with features
        run: cargo test --verbose --features onnx,resources
      - name: Integration test (ignored; network + dylib)
        # A clean SKIP (missing dylib / unsynced fixtures) is a local-dev
        # convenience — in CI it means the job asserted nothing, so treat
        # it as a failure.
        run: |
          set -o pipefail
          cargo test --features onnx,resources --test rerank_integration -- --ignored --nocapture | tee "$RUNNER_TEMP/integration.log"
          if grep -q "^SKIP:" "$RUNNER_TEMP/integration.log"; then
            echo "::error::integration test skipped in CI (see the SKIP line above)"
            exit 1
          fi
