[workspace]
resolver = "2"
members = ["kotoshu", "kotoshu-wasm"]
# The ruby-feature smoke shim (tests/ruby_ext) builds its own cdylib with
# magnus; excluded so default workspace builds stay dependency-free. Build
# it via scripts/ruby_ffi_smoke.sh (or --manifest-path tests/ruby_ext).
exclude = ["tests/ruby_ext"]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Ribose Inc. <open.source@ribose.com>"]
license = "BSD-2-Clause"
repository = "https://github.com/kotoshu/kotoshu-rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[profile.release.package."*"]
opt-level = "s"
