[package]
name = "kotoshu-python"
# Independent version line (parsanol policy): the PyPI distribution
# tracks THIS crate, not the core. 0.1.0 is a PLACEHOLDER — the first
# release and its version are owner decisions (plan 67 M5); publishing is
# blocked on PyPI credentials (see RELEASING.md).
version = "0.1.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage = "https://github.com/kotoshu/kotoshu-rs"
description = "maturin packaging shim: the kotoshu_native extension module over the kotoshu engine's pyo3 surface"

[lib]
# The importable module is `kotoshu_native`: maturin derives the module
# name from the lib name. cdylib is what maturin links into the wheel;
# the rlib keeps cargo test/clippy working.
name = "kotoshu_native"
crate-type = ["cdylib", "rlib"]

[features]
default = []
# Opt-in, mirroring the core's P0 policy: without it this member compiles
# against a dependency-free core with no pyo3 at all, so default
# workspace builds stay free of third-party dependencies. maturin builds
# enable it via [tool.maturin] in pyproject.toml (and the smoke script).
python = ["dep:pyo3", "kotoshu/python"]

[dependencies]
kotoshu = { path = "../kotoshu" }
# The #[pymodule] macro runs in THIS crate, so pyo3 is a direct dependency
# of the feature; the version matches the core's (0.29 line).
pyo3 = { version = "0.29", optional = true }
