[package]
name = "kotoshu"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme = "../README.md"
description = "Kotoshu semantic spell-checking engine: dictionaries, affixes, ranked suggestions, embedding reranking"
homepage = "https://github.com/kotoshu/kotoshu-rs"

[lib]
crate-type = ["rlib"]

# Optional dependencies attach per phase (plan 66): ruby -> magnus (P4),
# wasm -> wasm-bindgen/js-sys/console_error_panic_hook (P4),
# onnx -> ort/load-dynamic (P3), parallel -> rayon (P2), logging -> log (P1).
# Deliberately absent at P0 so CI stays green without those toolchains.
[features]
default = []
ruby = []
wasm = []
onnx = []
parallel = []
logging = []

# serde_json is a DEV dependency only (conformance-vector runner); the core
# crate itself stays zero third-party dependencies. `float_roundtrip` is
# load-bearing: without it serde_json's fast float parse is up to 1 ulp off,
# which breaks the exact f64 confidence comparison against the gem's
# exported values.
[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }

# Conformance-vector runner lives at the workspace root (plan 66 layout).
[[test]]
name = "conformance"
path = "../tests/conformance.rs"
